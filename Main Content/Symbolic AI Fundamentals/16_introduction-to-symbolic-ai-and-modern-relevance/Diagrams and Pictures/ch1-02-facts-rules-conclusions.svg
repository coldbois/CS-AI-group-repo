<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Facts + rules = derived knowledge</title><desc id="desc">A rule can produce a conclusion that was not stored as a direct fact.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef5f5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324b" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53677d"/></marker>
  <style>
    .h1{font:700 34px Arial,sans-serif;fill:#102b46} .sub{font:400 17px Arial,sans-serif;fill:#52677b}
    .h2{font:700 22px Arial,sans-serif;fill:#16324f} .txt{font:400 18px Arial,sans-serif;fill:#24415d}
    .small{font:400 15px Arial,sans-serif;fill:#53677d} .tiny{font:400 13px Arial,sans-serif;fill:#607286}
    .panel{fill:#fff;stroke:#d5e0eb;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#e7f0ff;stroke:#6c91c9;stroke-width:2;rx:16} .green{fill:#e7f6ef;stroke:#68a88b;stroke-width:2;rx:16}
    .gold{fill:#fff4dc;stroke:#d5a64f;stroke-width:2;rx:16} .rose{fill:#ffeded;stroke:#d78b8b;stroke-width:2;rx:16}
    .line{stroke:#53677d;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8a9caf;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<text x="55" y="62" class="h1">Facts + rules = derived knowledge</text>
<text x="55" y="94" class="sub">A rule can produce a conclusion that was not stored as a direct fact.</text>
<rect x="80" y="190" width="290" height="170" class="blue"/><text x="225.0" y="228" text-anchor="middle" class="h2">FACTS</text><text x="225.0" y="266" text-anchor="middle" class="txt">parent(john, mary)</text><text x="225.0" y="293" text-anchor="middle" class="txt">parent(mary, alice)</text><rect x="455" y="190" width="290" height="170" class="gold"/><text x="600.0" y="228" text-anchor="middle" class="h2">RULE</text><text x="600.0" y="266" text-anchor="middle" class="txt">grandparent(X,Y) if</text><text x="600.0" y="293" text-anchor="middle" class="txt">parent(X,Z) and parent(Z,Y)</text><path d="M375 275 H445" class="line"/><path d="M750 275 H820" class="line"/><rect x="830" y="190" width="290" height="170" class="green"/><text x="975.0" y="228" text-anchor="middle" class="h2">DERIVED RESULT</text><text x="975.0" y="266" text-anchor="middle" class="txt">grandparent(john, alice)</text><text x="975.0" y="293" text-anchor="middle" class="txt">The conclusion follows</text><text x="975.0" y="320" text-anchor="middle" class="txt">from the facts + rule</text><rect x="150" y="430" width="900" height="100" class="panel"/><text x="600" y="470" text-anchor="middle" class="h2">Important distinction</text><text x="600" y="505" text-anchor="middle" class="txt">The system derives a relationship; it does not need that exact conclusion stored as a fact.</text>
<text x="55" y="682" class="tiny">SOFTWARE &amp; SYMBOLIC AI  •  STUDY GUIDE</text>
</svg>