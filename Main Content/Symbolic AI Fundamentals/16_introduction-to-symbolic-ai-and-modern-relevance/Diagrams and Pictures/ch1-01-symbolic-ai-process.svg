<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">How a symbolic AI system reasons</title><desc id="desc">Knowledge is represented explicitly, then rules are applied to derive a conclusion.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef5f5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324b" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53677d"/></marker>
  <style>
    .h1{font:700 34px Arial,sans-serif;fill:#102b46} .sub{font:400 17px Arial,sans-serif;fill:#52677b}
    .h2{font:700 22px Arial,sans-serif;fill:#16324f} .txt{font:400 18px Arial,sans-serif;fill:#24415d}
    .small{font:400 15px Arial,sans-serif;fill:#53677d} .tiny{font:400 13px Arial,sans-serif;fill:#607286}
    .panel{fill:#fff;stroke:#d5e0eb;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#e7f0ff;stroke:#6c91c9;stroke-width:2;rx:16} .green{fill:#e7f6ef;stroke:#68a88b;stroke-width:2;rx:16}
    .gold{fill:#fff4dc;stroke:#d5a64f;stroke-width:2;rx:16} .rose{fill:#ffeded;stroke:#d78b8b;stroke-width:2;rx:16}
    .line{stroke:#53677d;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8a9caf;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<text x="55" y="62" class="h1">How a symbolic AI system reasons</text>
<text x="55" y="94" class="sub">Knowledge is represented explicitly, then rules are applied to derive a conclusion.</text>
<rect x="55" y="240" width="230" height="190" class="blue"/><text x="170.0" y="278" text-anchor="middle" class="h2">INPUT</text><text x="170.0" y="316" text-anchor="middle" class="txt">Facts and relationships</text><text x="170.0" y="343" text-anchor="middle" class="txt">e.g. student GPA = 3.6</text><path d="M290 335 H365" class="line"/><rect x="375" y="210" width="250" height="250" class="gold"/><text x="500.0" y="248" text-anchor="middle" class="h2">KNOWLEDGE BASE</text><text x="500.0" y="286" text-anchor="middle" class="txt">Stores facts and rules</text><text x="500.0" y="313" text-anchor="middle" class="txt">Rule: GPA ≥ 3.0</text><text x="500.0" y="340" text-anchor="middle" class="txt">means academic criterion met</text><path d="M630 335 H705" class="line"/><rect x="715" y="240" width="220" height="190" class="green"/><text x="825.0" y="278" text-anchor="middle" class="h2" style="font-size:18px">INFERENCE ENGINE</text><text x="825.0" y="316" text-anchor="middle" class="txt">Checks facts</text><text x="825.0" y="343" text-anchor="middle" class="txt">against relevant rules</text><path d="M940 335 H1010" class="line"/><rect x="1020" y="240" width="145" height="190" class="blue"/><text x="1092.5" y="278" text-anchor="middle" class="h2">RESULT</text><text x="1092.5" y="316" text-anchor="middle" class="txt">Criterion</text><text x="1092.5" y="343" text-anchor="middle" class="txt">satisfied</text>
<text x="55" y="682" class="tiny">SOFTWARE &amp; SYMBOLIC AI  •  STUDY GUIDE</text>
</svg>