<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From early AI to modern combinations</title><desc id="desc">A short orientation timeline: the field has evolved, but symbolic ideas remain in use.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef5f5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324b" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53677d"/></marker>
  <style>
    .h1{font:700 34px Arial,sans-serif;fill:#102b46} .sub{font:400 17px Arial,sans-serif;fill:#52677b}
    .h2{font:700 22px Arial,sans-serif;fill:#16324f} .txt{font:400 18px Arial,sans-serif;fill:#24415d}
    .small{font:400 15px Arial,sans-serif;fill:#53677d} .tiny{font:400 13px Arial,sans-serif;fill:#607286}
    .panel{fill:#fff;stroke:#d5e0eb;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#e7f0ff;stroke:#6c91c9;stroke-width:2;rx:16} .green{fill:#e7f6ef;stroke:#68a88b;stroke-width:2;rx:16}
    .gold{fill:#fff4dc;stroke:#d5a64f;stroke-width:2;rx:16} .rose{fill:#ffeded;stroke:#d78b8b;stroke-width:2;rx:16}
    .line{stroke:#53677d;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8a9caf;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<text x="55" y="62" class="h1">From early AI to modern combinations</text>
<text x="55" y="94" class="sub">A short orientation timeline: the field has evolved, but symbolic ideas remain in use.</text>
<rect x="45" y="205" width="205" height="270" class="blue"/><text x="147.5" y="243" text-anchor="middle" class="h2">1956</text><text x="147.5" y="281" text-anchor="middle" class="txt">Dartmouth workshop</text><text x="147.5" y="308" text-anchor="middle" class="txt">helps establish AI</text><text x="147.5" y="335" text-anchor="middle" class="txt">as a research field</text><rect x="275" y="205" width="205" height="270" class="gold"/><text x="377.5" y="243" text-anchor="middle" class="h2">1970s–1980s</text><text x="377.5" y="281" text-anchor="middle" class="txt">Expert systems</text><text x="377.5" y="308" text-anchor="middle" class="txt">become an important</text><text x="377.5" y="335" text-anchor="middle" class="txt">applied AI approach</text><rect x="505" y="205" width="205" height="270" class="green"/><text x="607.5" y="243" text-anchor="middle" class="h2">1990s–2000s</text><text x="607.5" y="281" text-anchor="middle" class="txt">Statistical machine</text><text x="607.5" y="308" text-anchor="middle" class="txt">learning grows in</text><text x="607.5" y="335" text-anchor="middle" class="txt">influence</text><rect x="735" y="205" width="205" height="270" class="blue"/><text x="837.5" y="243" text-anchor="middle" class="h2">2010s</text><text x="837.5" y="281" text-anchor="middle" class="txt">Deep learning brings</text><text x="837.5" y="308" text-anchor="middle" class="txt">major advances in</text><text x="837.5" y="335" text-anchor="middle" class="txt">pattern recognition</text><rect x="965" y="205" width="190" height="270" class="rose"/><text x="1060.0" y="243" text-anchor="middle" class="h2">Today</text><text x="1060.0" y="281" text-anchor="middle" class="txt">Symbolic reasoning</text><text x="1060.0" y="308" text-anchor="middle" class="txt">continues in planning,</text><text x="1060.0" y="335" text-anchor="middle" class="txt">knowledge systems and</text><text x="1060.0" y="362" text-anchor="middle" class="txt">neuro-symbolic work</text><text x="600" y="555" text-anchor="middle" class="small">These are broad milestones, not a complete or strictly linear history of AI.</text>
<text x="55" y="682" class="tiny">SOFTWARE &amp; SYMBOLIC AI  •  STUDY GUIDE</text>
</svg>