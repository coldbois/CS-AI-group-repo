<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A small rule-based program in Python</title><desc id="desc">A conditional statement checks an input and selects an output branch.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef5f5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324b" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53677d"/></marker>
  <style>
    .h1{font:700 34px Arial,sans-serif;fill:#102b46} .sub{font:400 17px Arial,sans-serif;fill:#52677b}
    .h2{font:700 22px Arial,sans-serif;fill:#16324f} .txt{font:400 18px Arial,sans-serif;fill:#24415d}
    .small{font:400 15px Arial,sans-serif;fill:#53677d} .tiny{font:400 13px Arial,sans-serif;fill:#607286}
    .panel{fill:#fff;stroke:#d5e0eb;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#e7f0ff;stroke:#6c91c9;stroke-width:2;rx:16} .green{fill:#e7f6ef;stroke:#68a88b;stroke-width:2;rx:16}
    .gold{fill:#fff4dc;stroke:#d5a64f;stroke-width:2;rx:16} .rose{fill:#ffeded;stroke:#d78b8b;stroke-width:2;rx:16}
    .line{stroke:#53677d;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8a9caf;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<text x="55" y="62" class="h1">A small rule-based program in Python</text>
<text x="55" y="94" class="sub">A conditional statement checks an input and selects an output branch.</text>
<rect x="80" y="175" width="390" height="350" class="panel"/><text x="115" y="220" class="h2">Pseudocode</text><text x="120" y="270" class="txt">Read computer_on</text><text x="120" y="318" class="txt">IF computer_on is no:</text><text x="120" y="366" class="txt">    suggest checking power</text><text x="120" y="414" class="txt">ELSE:</text><text x="120" y="462" class="txt">    ask about internet</text><text x="120" y="510" class="txt">    IF internet is no:</text><text x="120" y="558" class="txt">        suggest network check</text><path d="M490 350 H570" class="line"/><rect x="590" y="175" width="530" height="350" class="blue"/><text x="855" y="220" text-anchor="middle" class="h2">Program behaviour</text><rect x="650" y="255" width="410" height="75" class="green"/><text x="855" y="300" text-anchor="middle" class="txt">Input determines which branch runs</text><rect x="650" y="365" width="190" height="90" class="gold"/><text x="745" y="402" text-anchor="middle" class="txt">Power</text><text x="745" y="427" text-anchor="middle" class="small">suggestion</text><rect x="870" y="365" width="190" height="90" class="gold"/><text x="965" y="402" text-anchor="middle" class="txt">Network</text><text x="965" y="427" text-anchor="middle" class="small">suggestion</text>
<text x="55" y="682" class="tiny">SOFTWARE &amp; SYMBOLIC AI  •  STUDY GUIDE</text>
</svg>