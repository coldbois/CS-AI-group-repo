<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Worked example: admission criteria checker</title><desc id="desc">This toy example checks two stated criteria; it does not decide real university admission.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef5f5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324b" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53677d"/></marker>
  <style>
    .h1{font:700 34px Arial,sans-serif;fill:#102b46} .sub{font:400 17px Arial,sans-serif;fill:#52677b}
    .h2{font:700 22px Arial,sans-serif;fill:#16324f} .txt{font:400 18px Arial,sans-serif;fill:#24415d}
    .small{font:400 15px Arial,sans-serif;fill:#53677d} .tiny{font:400 13px Arial,sans-serif;fill:#607286}
    .panel{fill:#fff;stroke:#d5e0eb;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#e7f0ff;stroke:#6c91c9;stroke-width:2;rx:16} .green{fill:#e7f6ef;stroke:#68a88b;stroke-width:2;rx:16}
    .gold{fill:#fff4dc;stroke:#d5a64f;stroke-width:2;rx:16} .rose{fill:#ffeded;stroke:#d78b8b;stroke-width:2;rx:16}
    .line{stroke:#53677d;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8a9caf;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<text x="55" y="62" class="h1">Worked example: admission criteria checker</text>
<text x="55" y="94" class="sub">This toy example checks two stated criteria; it does not decide real university admission.</text>
<rect x="65" y="190" width="260" height="190" class="blue"/><text x="195.0" y="228" text-anchor="middle" class="h2">INPUT</text><text x="195.0" y="266" text-anchor="middle" class="txt">GPA = 3.5</text><text x="195.0" y="293" text-anchor="middle" class="txt">English qualification = yes</text><path d="M330 285 H405" class="line"/><rect x="415" y="170" width="340" height="230" class="gold"/><text x="585.0" y="208" text-anchor="middle" class="h2">RULES</text><text x="585.0" y="246" text-anchor="middle" class="txt">Rule 1: GPA ≥ 3.0</text><text x="585.0" y="273" text-anchor="middle" class="txt">Rule 2: English = yes</text><text x="585.0" y="300" text-anchor="middle" class="txt">Rule 3: both must be true</text><path d="M760 285 H835" class="line"/><rect x="845" y="190" width="290" height="190" class="green"/><text x="990.0" y="228" text-anchor="middle" class="h2">RESULT</text><text x="990.0" y="266" text-anchor="middle" class="txt">Both example criteria</text><text x="990.0" y="293" text-anchor="middle" class="txt">are satisfied</text><text x="600" y="485" text-anchor="middle" class="small">In a real application, policies, exceptions and human review would need careful design.</text>
<text x="55" y="682" class="tiny">SOFTWARE &amp; SYMBOLIC AI  •  STUDY GUIDE</text>
</svg>