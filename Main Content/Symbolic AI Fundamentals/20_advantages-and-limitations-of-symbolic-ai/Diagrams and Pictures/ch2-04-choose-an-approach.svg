<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Choosing an approach for a task</title><desc id="desc">A practical guide: use the structure of the problem to inform the method.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef5f5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324b" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53677d"/></marker>
  <style>
    .h1{font:700 34px Arial,sans-serif;fill:#102b46} .sub{font:400 17px Arial,sans-serif;fill:#52677b}
    .h2{font:700 22px Arial,sans-serif;fill:#16324f} .txt{font:400 18px Arial,sans-serif;fill:#24415d}
    .small{font:400 15px Arial,sans-serif;fill:#53677d} .tiny{font:400 13px Arial,sans-serif;fill:#607286}
    .panel{fill:#fff;stroke:#d5e0eb;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#e7f0ff;stroke:#6c91c9;stroke-width:2;rx:16} .green{fill:#e7f6ef;stroke:#68a88b;stroke-width:2;rx:16}
    .gold{fill:#fff4dc;stroke:#d5a64f;stroke-width:2;rx:16} .rose{fill:#ffeded;stroke:#d78b8b;stroke-width:2;rx:16}
    .line{stroke:#53677d;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8a9caf;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<text x="55" y="62" class="h1">Choosing an approach for a task</text>
<text x="55" y="94" class="sub">A practical guide: use the structure of the problem to inform the method.</text>
<path d="M600 150 V205" class="line"/><rect x="365" y="105" width="470" height="85" class="blue"/><text x="600" y="155" text-anchor="middle" class="h2">Can the task be expressed as clear facts and rules?</text><path d="M600 190 V235 H300 V285" class="line"/><path d="M600 190 V235 H900 V285" class="line"/><text x="420" y="225" class="small">YES</text><text x="770" y="225" class="small">NOT EASILY</text><rect x="80" y="290" width="440" height="180" class="green"/><text x="300.0" y="328" text-anchor="middle" class="h2" style="font-size:18px">CONSIDER SYMBOLIC</text><text x="300.0" y="366" text-anchor="middle" class="txt">Eligibility, policy checks,</text><text x="300.0" y="393" text-anchor="middle" class="txt">structured troubleshooting,</text><text x="300.0" y="420" text-anchor="middle" class="txt">constraint-based planning</text><rect x="680" y="290" width="440" height="180" class="gold"/><text x="900.0" y="328" text-anchor="middle" class="h2" style="font-size:18px">CONSIDER LEARNING METHODS</text><text x="900.0" y="366" text-anchor="middle" class="txt">Image or speech recognition,</text><text x="900.0" y="393" text-anchor="middle" class="txt">complex pattern discovery,</text><text x="900.0" y="420" text-anchor="middle" class="txt">large unstructured datasets</text><path d="M300 475 V530 H600" class="dash"/><path d="M900 475 V530 H600" class="dash"/><text x="600" y="580" text-anchor="middle" class="h2">Could a hybrid combine both strengths?</text>
<text x="55" y="682" class="tiny">SOFTWARE &amp; SYMBOLIC AI  •  STUDY GUIDE</text>
</svg>