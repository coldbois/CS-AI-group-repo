<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">The trade-off: clarity versus coverage</title><desc id="desc">The same design choices that make a rule system clear can also make it rigid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef5f5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324b" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53677d"/></marker>
  <style>
    .h1{font:700 34px Arial,sans-serif;fill:#102b46} .sub{font:400 17px Arial,sans-serif;fill:#52677b}
    .h2{font:700 22px Arial,sans-serif;fill:#16324f} .txt{font:400 18px Arial,sans-serif;fill:#24415d}
    .small{font:400 15px Arial,sans-serif;fill:#53677d} .tiny{font:400 13px Arial,sans-serif;fill:#607286}
    .panel{fill:#fff;stroke:#d5e0eb;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#e7f0ff;stroke:#6c91c9;stroke-width:2;rx:16} .green{fill:#e7f6ef;stroke:#68a88b;stroke-width:2;rx:16}
    .gold{fill:#fff4dc;stroke:#d5a64f;stroke-width:2;rx:16} .rose{fill:#ffeded;stroke:#d78b8b;stroke-width:2;rx:16}
    .line{stroke:#53677d;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke:#8a9caf;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<text x="55" y="62" class="h1">The trade-off: clarity versus coverage</text>
<text x="55" y="94" class="sub">The same design choices that make a rule system clear can also make it rigid.</text>
<rect x="80" y="205" width="470" height="330" class="green"/><text x="315.0" y="243" text-anchor="middle" class="h2" style="font-size:18px">WHAT THE APPROACH GIVES</text><text x="315.0" y="281" text-anchor="middle" class="txt">Explicit rules and knowledge</text><text x="315.0" y="308" text-anchor="middle" class="txt">Traceable reasoning steps</text><text x="315.0" y="335" text-anchor="middle" class="txt">Consistent application</text><text x="315.0" y="362" text-anchor="middle" class="txt">Direct control over rule changes</text><rect x="650" y="205" width="470" height="330" class="rose"/><text x="885.0" y="243" text-anchor="middle" class="h2" style="font-size:18px">WHAT THE APPROACH COSTS</text><text x="885.0" y="281" text-anchor="middle" class="txt">Knowledge must be represented</text><text x="885.0" y="308" text-anchor="middle" class="txt">Exceptions need careful handling</text><text x="885.0" y="335" text-anchor="middle" class="txt">Uncertain inputs need extensions</text><text x="885.0" y="362" text-anchor="middle" class="txt">Large rule sets need maintenance</text><text x="600" y="590" text-anchor="middle" class="h2">Good design starts by matching the method to the problem.</text>
<text x="55" y="682" class="tiny">SOFTWARE &amp; SYMBOLIC AI  •  STUDY GUIDE</text>
</svg>