<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 1: The software development life cycle</title>
  <desc>Six stages in order: requirements, design, implementation, testing, deployment, maintenance. Each stage lists what it produces. An arrow from maintenance back to requirements shows that new needs and bug reports start the next round.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 1: The software development life cycle (SDLC)</text>

  <rect x="35" y="90" width="115" height="85" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1. Requirements</text>
  <text x="92" y="142" text-anchor="middle" font-size="11" fill="#111111">user stories,</text>
  <text x="92" y="158" text-anchor="middle" font-size="11" fill="#111111">requirements list</text>

  <rect x="178" y="90" width="115" height="85" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="235" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2. Design</text>
  <text x="235" y="142" text-anchor="middle" font-size="11" fill="#111111">architecture,</text>
  <text x="235" y="158" text-anchor="middle" font-size="11" fill="#111111">screen sketches</text>

  <rect x="321" y="90" width="115" height="85" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="378" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">3. Implementation</text>
  <text x="378" y="142" text-anchor="middle" font-size="11" fill="#111111">source code</text>
  <text x="378" y="158" text-anchor="middle" font-size="11" fill="#111111">(kept in Git)</text>

  <rect x="464" y="90" width="115" height="85" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="521" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">4. Testing</text>
  <text x="521" y="142" text-anchor="middle" font-size="11" fill="#111111">test cases,</text>
  <text x="521" y="158" text-anchor="middle" font-size="11" fill="#111111">test results</text>

  <rect x="607" y="90" width="115" height="85" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="664" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">5. Deployment</text>
  <text x="664" y="142" text-anchor="middle" font-size="11" fill="#111111">released version</text>
  <text x="664" y="158" text-anchor="middle" font-size="11" fill="#111111">(for example 1.0.0)</text>

  <rect x="750" y="90" width="115" height="85" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="807" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">6. Maintenance</text>
  <text x="807" y="142" text-anchor="middle" font-size="11" fill="#111111">bug fixes,</text>
  <text x="807" y="158" text-anchor="middle" font-size="11" fill="#111111">updates</text>

  <line x1="150" y1="132" x2="176" y2="132" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="293" y1="132" x2="319" y2="132" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436" y1="132" x2="462" y2="132" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="579" y1="132" x2="605" y2="132" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="722" y1="132" x2="748" y2="132" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M850,175 L850,265 L50,265 L50,177" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
  <text x="450" y="255" text-anchor="middle" font-size="13" fill="#111111">New needs and bug reports start the next round</text>

  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#111111">In real projects the stages overlap and repeat. Even testing can send the team back to design.</text>
</svg>
