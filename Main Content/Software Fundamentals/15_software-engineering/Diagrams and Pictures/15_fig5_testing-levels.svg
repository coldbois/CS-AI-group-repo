<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 5: Levels of testing</title>
  <desc>A pyramid with four levels. From the bottom: unit testing, integration testing, system testing, acceptance testing. Lower levels have more, faster, cheaper tests. Higher levels have fewer, slower, costlier tests.</desc>
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 5: Levels of testing</text>

  <polygon points="300,60 360,145 240,145" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Acceptance</text>

  <polygon points="240,145 360,145 420,230 180,230" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="300" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">System</text>

  <polygon points="180,230 420,230 480,315 120,315" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="300" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Integration</text>

  <polygon points="120,315 480,315 540,400 60,400" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="362" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Unit</text>

  <text x="565" y="108" font-size="13" font-weight="bold" fill="#111111">Does it meet the user's needs?</text>
  <text x="565" y="126" font-size="12" fill="#111111">checked with users or the client</text>

  <text x="565" y="185" font-size="13" font-weight="bold" fill="#111111">Does the complete system</text>
  <text x="565" y="203" font-size="13" font-weight="bold" fill="#111111">work as specified?</text>

  <text x="565" y="270" font-size="13" font-weight="bold" fill="#111111">Do the parts work together?</text>
  <text x="565" y="288" font-size="12" fill="#111111">for example the app and its database</text>

  <text x="565" y="355" font-size="13" font-weight="bold" fill="#111111">Does each small piece</text>
  <text x="565" y="373" font-size="13" font-weight="bold" fill="#111111">work on its own?</text>

  <text x="400" y="435" text-anchor="middle" font-size="13" fill="#111111">Bottom: many tests, fast and cheap to run.  Top: fewer tests, slower and costlier.</text>
  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#111111">Regression testing repeats earlier tests after a change, to check that nothing that used to work has broken.</text>
</svg>
