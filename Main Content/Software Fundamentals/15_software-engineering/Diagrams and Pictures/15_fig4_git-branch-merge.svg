<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 4: A Git branch and a merge</title>
  <desc>The main branch has commits C1, C2, C3 and a merge commit M. A feature branch starts at C2, has one commit F1, and is merged back into main at M.</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 4: A Git branch and a merge</text>

  <line x1="118" y1="120" x2="232" y2="120" stroke="#2563eb" stroke-width="4"/>
  <line x1="268" y1="120" x2="432" y2="120" stroke="#2563eb" stroke-width="4"/>
  <line x1="468" y1="120" x2="632" y2="120" stroke="#2563eb" stroke-width="4"/>
  <line x1="262" y1="133" x2="338" y2="217" stroke="#16a34a" stroke-width="4"/>
  <line x1="368" y1="217" x2="640" y2="133" stroke="#16a34a" stroke-width="4"/>

  <text x="75" y="126" text-anchor="end" font-size="15" font-weight="bold" fill="#2563eb">main</text>

  <circle cx="100" cy="120" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="100" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">C1</text>
  <text x="100" y="158" text-anchor="middle" font-size="11" fill="#111111">add notes</text>

  <circle cx="250" cy="120" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="250" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">C2</text>
  <text x="250" y="158" text-anchor="middle" font-size="11" fill="#111111">add email note</text>

  <circle cx="450" cy="120" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">C3</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#111111">add attendance note</text>

  <circle cx="650" cy="120" r="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
  <text x="650" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">M</text>
  <text x="650" y="90" text-anchor="middle" font-size="11" fill="#111111">merge commit</text>

  <circle cx="350" cy="230" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="350" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">F1</text>
  <text x="350" y="268" text-anchor="middle" font-size="11" fill="#111111">add reminder note</text>
  <text x="350" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">feature/reminder</text>

  <text x="140" y="212" font-size="12" fill="#111111">branch starts here</text>
  <text x="140" y="228" font-size="12" fill="#111111">(from C2)</text>
  <text x="560" y="228" font-size="12" fill="#111111">both lines of work</text>
  <text x="560" y="244" font-size="12" fill="#111111">come together at M</text>

  <text x="400" y="335" text-anchor="middle" font-size="13" fill="#111111">Commit = a saved snapshot of the project · Branch = a separate line of work · Merge = combine two lines of work</text>
  <text x="400" y="358" text-anchor="middle" font-size="13" fill="#111111">If both branches changed the same lines (as C3 and F1 did here), Git reports a conflict</text>
  <text x="400" y="376" text-anchor="middle" font-size="13" fill="#111111">and a person must choose what the final text should be.</text>
</svg>
