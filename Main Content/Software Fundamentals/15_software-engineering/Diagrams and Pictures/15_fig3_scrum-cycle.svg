<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 3: The Scrum cycle</title>
  <desc>The product backlog feeds sprint planning, which produces the sprint backlog. The sprint, with a daily scrum, produces an increment. The sprint review and sprint retrospective follow, then the next sprint planning begins. Review feedback updates the product backlog.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 3: The Scrum cycle (one sprint)</text>

  <rect x="30" y="70" width="170" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="115" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Product Backlog</text>
  <text x="115" y="114" text-anchor="middle" font-size="11" fill="#111111">ordered list of wanted work</text>

  <rect x="250" y="70" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Sprint Planning</text>
  <text x="335" y="114" text-anchor="middle" font-size="11" fill="#111111">choose what to do this sprint</text>

  <rect x="470" y="70" width="170" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="555" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Sprint Backlog</text>
  <text x="555" y="114" text-anchor="middle" font-size="11" fill="#111111">the chosen items and the plan</text>

  <rect x="690" y="70" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">The Sprint</text>
  <text x="780" y="114" text-anchor="middle" font-size="11" fill="#111111">build and test the items</text>

  <line x1="200" y1="100" x2="248" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="100" x2="468" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="100" x2="688" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="745" y="152" text-anchor="middle" font-size="11" fill="#111111">includes a 15-minute</text>
  <text x="745" y="167" text-anchor="middle" font-size="11" fill="#111111">Daily Scrum each day</text>

  <line x1="850" y1="130" x2="850" y2="258" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690" y="260" width="180" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Increment</text>
  <text x="780" y="304" text-anchor="middle" font-size="11" fill="#111111">working, usable software</text>

  <rect x="470" y="260" width="170" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="555" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Sprint Review</text>
  <text x="555" y="304" text-anchor="middle" font-size="11" fill="#111111">show it, gather feedback</text>

  <rect x="250" y="260" width="170" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="335" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Sprint Retrospective</text>
  <text x="335" y="304" text-anchor="middle" font-size="11" fill="#111111">how can the team improve?</text>

  <line x1="690" y1="290" x2="642" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="290" x2="422" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="335" y1="258" x2="335" y2="132" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="200" font-size="12" fill="#111111">next sprint</text>

  <path d="M555,320 L555,355 L115,355 L115,132" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
  <text x="335" y="347" text-anchor="middle" font-size="12" fill="#111111">feedback updates the Product Backlog</text>

  <text x="450" y="400" text-anchor="middle" font-size="13" fill="#111111">A sprint is a fixed length of one month or less, so the team delivers working software regularly.</text>
  <text x="450" y="425" text-anchor="middle" font-size="13" fill="#111111">Roles: Product Owner (what to build, in what order) · Developers (build it) · Scrum Master (helps the team use Scrum well)</text>
</svg>
