<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 2: Waterfall compared with Agile</title>
  <desc>Top: waterfall as a staircase of five stages, each finishing before the next starts. Bottom: agile as three sprints, each ending with a working increment that grows with every sprint.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 2: Waterfall compared with Agile</text>

  <text x="30" y="58" font-size="15" font-weight="bold" fill="#111111">Waterfall: each stage finishes before the next begins</text>
  <rect x="30" y="70" width="130" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-size="13" fill="#111111">Requirements</text>
  <rect x="200" y="94" width="130" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="265" y="114" text-anchor="middle" font-size="13" fill="#111111">Design</text>
  <rect x="370" y="118" width="130" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="435" y="138" text-anchor="middle" font-size="13" fill="#111111">Implementation</text>
  <rect x="540" y="142" width="130" height="30" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="605" y="162" text-anchor="middle" font-size="13" fill="#111111">Testing</text>
  <rect x="710" y="166" width="130" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="775" y="186" text-anchor="middle" font-size="13" fill="#111111">Release</text>
  <line x1="160" y1="85" x2="198" y2="109" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="109" x2="368" y2="133" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="133" x2="538" y2="157" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="157" x2="708" y2="181" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30" y="215" font-size="12" fill="#111111">Users see working software only at the end. Changes late in the project are costly.</text>

  <line x1="30" y1="235" x2="870" y2="235" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="30" y="262" font-size="15" font-weight="bold" fill="#111111">Agile: short cycles, each ending with working software</text>
  <rect x="40" y="275" width="250" height="140" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="165" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Sprint 1</text>
  <text x="165" y="322" text-anchor="middle" font-size="12" fill="#111111">plan → build → test → review</text>
  <rect x="60" y="340" width="70" height="28" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="392" text-anchor="middle" font-size="12" fill="#111111">Working software: increment 1</text>

  <rect x="330" y="275" width="250" height="140" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="455" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Sprint 2</text>
  <text x="455" y="322" text-anchor="middle" font-size="12" fill="#111111">plan → build → test → review</text>
  <rect x="350" y="340" width="70" height="28" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <rect x="420" y="340" width="70" height="28" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  <text x="455" y="392" text-anchor="middle" font-size="12" fill="#111111">Working software: increments 1 + 2</text>

  <rect x="620" y="275" width="250" height="140" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="745" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Sprint 3</text>
  <text x="745" y="322" text-anchor="middle" font-size="12" fill="#111111">plan → build → test → review</text>
  <rect x="640" y="340" width="70" height="28" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <rect x="710" y="340" width="70" height="28" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  <rect x="780" y="340" width="70" height="28" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="745" y="392" text-anchor="middle" font-size="12" fill="#111111">Working software: increments 1 + 2 + 3</text>

  <line x1="290" y1="345" x2="328" y2="345" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="345" x2="618" y2="345" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="448" text-anchor="middle" font-size="13" fill="#111111">Feedback after each sprint shapes what the team builds next.</text>
</svg>
