<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 2: From source code to a running program</title>
  <desc>Three routes: compiled (source, compiler, executable, CPU), interpreted (source, interpreter, CPU), and hybrid (source, compiler to bytecode, bytecode, virtual machine, CPU).</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 2: From source code to a running program</text>

  <text x="30" y="68" font-size="15" font-weight="bold" fill="#111111">Route 1: Compiled (for example C)</text>
  <rect x="30" y="80" width="120" height="50" rx="8" fill="#fff4d6" stroke="#b58900" stroke-width="2"/>
  <text x="90" y="110" text-anchor="middle" font-size="14" fill="#111111">Source code</text>
  <line x1="150" y1="105" x2="183" y2="105" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185" y="80" width="120" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Compiler</text>
  <line x1="305" y1="105" x2="338" y2="105" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="80" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="415" y="101" text-anchor="middle" font-size="13" fill="#111111">Executable file</text>
  <text x="415" y="118" text-anchor="middle" font-size="12" fill="#111111">(machine code)</text>
  <line x1="490" y1="105" x2="523" y2="105" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="525" y="80" width="110" height="50" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="580" y="110" text-anchor="middle" font-size="14" fill="#111111">CPU runs it</text>
  <text x="660" y="100" font-size="12" fill="#111111">Whole program is translated first,</text>
  <text x="660" y="117" font-size="12" fill="#111111">then run. Syntax errors stop the build.</text>

  <text x="30" y="178" font-size="15" font-weight="bold" fill="#111111">Route 2: Interpreted (reads and runs as it goes)</text>
  <rect x="30" y="190" width="120" height="50" rx="8" fill="#fff4d6" stroke="#b58900" stroke-width="2"/>
  <text x="90" y="220" text-anchor="middle" font-size="14" fill="#111111">Source code</text>
  <line x1="150" y1="215" x2="183" y2="215" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185" y="190" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Interpreter</text>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#111111">one step at a time</text>
  <line x1="335" y1="215" x2="368" y2="215" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="370" y="190" width="190" height="50" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="465" y="220" text-anchor="middle" font-size="14" fill="#111111">CPU carries out each step</text>
  <text x="590" y="210" font-size="12" fill="#111111">No separate executable file.</text>
  <text x="590" y="227" font-size="12" fill="#111111">Quick to test and change.</text>

  <text x="30" y="288" font-size="15" font-weight="bold" fill="#111111">Route 3: Hybrid (for example Java, and Python's standard version)</text>
  <rect x="30" y="300" width="100" height="50" rx="8" fill="#fff4d6" stroke="#b58900" stroke-width="2"/>
  <text x="80" y="330" text-anchor="middle" font-size="13" fill="#111111">Source code</text>
  <line x1="130" y1="325" x2="163" y2="325" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="165" y="300" width="125" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="227" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Compiler</text>
  <text x="227" y="338" text-anchor="middle" font-size="12" fill="#111111">to bytecode</text>
  <line x1="290" y1="325" x2="323" y2="325" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="325" y="300" width="100" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="375" y="330" text-anchor="middle" font-size="14" fill="#111111">Bytecode</text>
  <line x1="425" y1="325" x2="458" y2="325" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="300" width="140" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="530" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Virtual machine</text>
  <text x="530" y="338" text-anchor="middle" font-size="12" fill="#111111">runs the bytecode</text>
  <line x1="600" y1="325" x2="633" y2="325" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="635" y="300" width="90" height="50" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="680" y="330" text-anchor="middle" font-size="14" fill="#111111">CPU</text>
  <text x="745" y="320" font-size="12" fill="#111111">Same bytecode can run</text>
  <text x="745" y="337" font-size="12" fill="#111111">wherever the VM exists.</text>

  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#111111">Real languages mix these ideas, so "compiled" or "interpreted" describes how a language is usually run, not a fixed rule.</text>
  <text x="450" y="425" text-anchor="middle" font-size="13" fill="#111111">Here "virtual machine" means a program that runs bytecode. It is not the same as an operating system virtual machine.</text>
</svg>
