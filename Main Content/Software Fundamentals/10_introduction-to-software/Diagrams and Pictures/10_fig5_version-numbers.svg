<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 5: Reading a version number (MAJOR.MINOR.PATCH)</title>
  <desc>The version 2.4.1 has three parts. MAJOR changes when old users may be affected, MINOR when new features are added without breaking old ones, and PATCH when only bugs are fixed.</desc>
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 5: Reading a version number (MAJOR.MINOR.PATCH)</text>

  <text x="200" y="125" text-anchor="middle" font-size="72" font-weight="bold" fill="#1d4ed8">2</text>
  <text x="300" y="125" text-anchor="middle" font-size="72" font-weight="bold" fill="#111111">.</text>
  <text x="400" y="125" text-anchor="middle" font-size="72" font-weight="bold" fill="#15803d">4</text>
  <text x="500" y="125" text-anchor="middle" font-size="72" font-weight="bold" fill="#111111">.</text>
  <text x="600" y="125" text-anchor="middle" font-size="72" font-weight="bold" fill="#c2410c">1</text>

  <rect x="120" y="145" width="160" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">MAJOR</text>
  <rect x="320" y="145" width="160" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">MINOR</text>
  <rect x="520" y="145" width="160" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PATCH</text>

  <text x="200" y="205" text-anchor="middle" font-size="13" fill="#111111">Changes that can break</text>
  <text x="200" y="222" text-anchor="middle" font-size="13" fill="#111111">how old files or add-ons</text>
  <text x="200" y="239" text-anchor="middle" font-size="13" fill="#111111">work</text>
  <text x="400" y="205" text-anchor="middle" font-size="13" fill="#111111">New features added,</text>
  <text x="400" y="222" text-anchor="middle" font-size="13" fill="#111111">old things still work</text>
  <text x="600" y="205" text-anchor="middle" font-size="13" fill="#111111">Bug fixes only,</text>
  <text x="600" y="222" text-anchor="middle" font-size="13" fill="#111111">no new features</text>

  <line x1="60" y1="270" x2="740" y2="270" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="400" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">What happens to the number when the software changes</text>
  <text x="120" y="330" font-size="14" fill="#111111">2.4.1  →  2.4.2</text>
  <text x="300" y="330" font-size="14" fill="#111111">a bug was fixed (PATCH goes up)</text>
  <text x="120" y="358" font-size="14" fill="#111111">2.4.2  →  2.5.0</text>
  <text x="300" y="358" font-size="14" fill="#111111">a new feature was added (MINOR goes up, PATCH resets to 0)</text>
  <text x="120" y="386" font-size="14" fill="#111111">2.5.0  →  3.0.0</text>
  <text x="300" y="386" font-size="14" fill="#111111">a breaking change (MAJOR goes up, MINOR and PATCH reset to 0)</text>
  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#111111">Many products follow this scheme (called semantic versioning). Others use dates or plain counting, such as 24.04.</text>
</svg>
