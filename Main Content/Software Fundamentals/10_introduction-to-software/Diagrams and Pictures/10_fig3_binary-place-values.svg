<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 3: Reading an 8-bit binary number</title>
  <desc>The byte 00101101 has place values 128, 64, 32, 16, 8, 4, 2, 1. The bits that are 1 are at 32, 8, 4 and 1, so the value is 32 + 8 + 4 + 1 = 45.</desc>
  <rect width="800" height="340" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 3: Reading the byte 00101101</text>

  <text x="82" y="85" text-anchor="end" font-size="13" font-weight="bold" fill="#111111">Place value</text>
  <text x="82" y="145" text-anchor="end" font-size="13" font-weight="bold" fill="#111111">Bit</text>
  <text x="82" y="205" text-anchor="end" font-size="13" font-weight="bold" fill="#111111">Counts as</text>

  <rect x="90" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="127" y="87" text-anchor="middle" font-size="16" fill="#111111">128</text>
  <rect x="165" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="202" y="87" text-anchor="middle" font-size="16" fill="#111111">64</text>
  <rect x="240" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="277" y="87" text-anchor="middle" font-size="16" fill="#111111">32</text>
  <rect x="315" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="352" y="87" text-anchor="middle" font-size="16" fill="#111111">16</text>
  <rect x="390" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="427" y="87" text-anchor="middle" font-size="16" fill="#111111">8</text>
  <rect x="465" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="502" y="87" text-anchor="middle" font-size="16" fill="#111111">4</text>
  <rect x="540" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="577" y="87" text-anchor="middle" font-size="16" fill="#111111">2</text>
  <rect x="615" y="60" width="75" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="652" y="87" text-anchor="middle" font-size="16" fill="#111111">1</text>

  <rect x="90" y="110" width="75" height="50" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="127" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#6b7280">0</text>
  <rect x="165" y="110" width="75" height="50" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="202" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#6b7280">0</text>
  <rect x="240" y="110" width="75" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="277" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">1</text>
  <rect x="315" y="110" width="75" height="50" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="352" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#6b7280">0</text>
  <rect x="390" y="110" width="75" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="427" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">1</text>
  <rect x="465" y="110" width="75" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="502" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">1</text>
  <rect x="540" y="110" width="75" height="50" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="577" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#6b7280">0</text>
  <rect x="615" y="110" width="75" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="652" y="146" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">1</text>

  <rect x="90" y="170" width="75" height="40" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="127" y="196" text-anchor="middle" font-size="15" fill="#6b7280">0</text>
  <rect x="165" y="170" width="75" height="40" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="202" y="196" text-anchor="middle" font-size="15" fill="#6b7280">0</text>
  <rect x="240" y="170" width="75" height="40" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="277" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">32</text>
  <rect x="315" y="170" width="75" height="40" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="352" y="196" text-anchor="middle" font-size="15" fill="#6b7280">0</text>
  <rect x="390" y="170" width="75" height="40" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="427" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">8</text>
  <rect x="465" y="170" width="75" height="40" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="502" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">4</text>
  <rect x="540" y="170" width="75" height="40" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="577" y="196" text-anchor="middle" font-size="15" fill="#6b7280">0</text>
  <rect x="615" y="170" width="75" height="40" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="652" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1</text>

  <text x="400" y="255" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">32 + 8 + 4 + 1 = 45</text>
  <text x="400" y="285" text-anchor="middle" font-size="13" fill="#111111">A bit that is 1 adds its place value. A bit that is 0 adds nothing.</text>
  <text x="400" y="305" text-anchor="middle" font-size="13" fill="#111111">Each place value is double the one to its right.</text>
</svg>
