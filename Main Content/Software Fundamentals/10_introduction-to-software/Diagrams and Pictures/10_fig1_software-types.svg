<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 1: Types of software and where they sit</title>
  <desc>A stack from the user down to hardware: application software, middleware, system software, firmware and hardware. Programming software sits beside the stack because it is used to build software.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 1: Types of software and where they sit</text>

  <rect x="40" y="55" width="480" height="40" rx="8" fill="#fff4d6" stroke="#b58900" stroke-width="2"/>
  <text x="280" y="81" text-anchor="middle" font-size="15" fill="#111111">You (the user)</text>
  <line x1="280" y1="95" x2="280" y2="113" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="115" width="480" height="75" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Application software</text>
  <text x="280" y="164" text-anchor="middle" font-size="13" fill="#111111">web browser · word processor · games · messaging apps</text>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#111111">(does tasks for the user)</text>
  <line x1="280" y1="190" x2="280" y2="208" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="210" width="480" height="55" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="280" y="234" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Middleware</text>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#111111">connects other software, e.g. a database connector</text>
  <line x1="280" y1="265" x2="280" y2="283" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="285" width="480" height="75" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">System software</text>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#111111">operating system · device drivers · utilities</text>
  <text x="280" y="351" text-anchor="middle" font-size="12" fill="#111111">(manages the computer for everything above)</text>
  <line x1="280" y1="360" x2="280" y2="378" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="380" width="480" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="280" y="403" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Firmware / embedded software</text>
  <text x="280" y="421" text-anchor="middle" font-size="12" fill="#111111">stored inside devices: router, TV, washing machine, start-up code</text>
  <line x1="280" y1="430" x2="280" y2="448" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="450" width="480" height="45" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="280" y="478" text-anchor="middle" font-size="15" fill="#111111">Hardware: CPU · RAM · storage · screen · network card</text>

  <rect x="570" y="115" width="200" height="245" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Programming</text>
  <text x="670" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">software</text>
  <text x="670" y="190" text-anchor="middle" font-size="12" fill="#111111">(used to MAKE software)</text>
  <text x="600" y="225" font-size="13" fill="#111111">• code editors</text>
  <text x="600" y="247" font-size="13" fill="#111111">• compilers</text>
  <text x="600" y="269" font-size="13" fill="#111111">• interpreters</text>
  <text x="600" y="291" font-size="13" fill="#111111">• debuggers</text>
  <text x="600" y="313" font-size="13" fill="#111111">• IDEs</text>
  <text x="600" y="335" font-size="13" fill="#111111">• version control (Git)</text>

  <line x1="570" y1="152" x2="522" y2="152" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="570" y1="322" x2="522" y2="322" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="670" y="385" text-anchor="middle" font-size="12" fill="#111111">dashed arrows: the tools that</text>
  <text x="670" y="401" text-anchor="middle" font-size="12" fill="#111111">build the software in the stack</text>
</svg>
