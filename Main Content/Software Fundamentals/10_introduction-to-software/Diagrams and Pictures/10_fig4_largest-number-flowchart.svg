<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" width="700" height="680" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 4: Flowchart of an algorithm that finds the largest number in a list</title>
  <desc>Start, set largest to the first number, then repeat: if there is another number, take it, and if it is larger than largest, replace largest. When there are no more numbers, output largest and end.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="700" height="680" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Figure 4: Finding the largest number in a list</text>

  <rect x="190" y="45" width="120" height="35" rx="17" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="250" y="68" text-anchor="middle" font-size="15" fill="#111111">Start</text>
  <line x1="250" y1="80" x2="250" y2="108" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="110" width="220" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" font-size="14" fill="#111111">largest = first number</text>
  <line x1="250" y1="160" x2="250" y2="198" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="250,200 360,245 250,290 140,245" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="250" y="241" text-anchor="middle" font-size="13" fill="#111111">Is there another</text>
  <text x="250" y="258" text-anchor="middle" font-size="13" fill="#111111">number?</text>

  <line x1="360" y1="245" x2="468" y2="245" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="412" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">No</text>
  <rect x="470" y="220" width="180" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="250" text-anchor="middle" font-size="14" fill="#111111">Output largest</text>
  <line x1="560" y1="270" x2="560" y2="308" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="310" width="120" height="35" rx="17" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="560" y="333" text-anchor="middle" font-size="15" fill="#111111">End</text>

  <line x1="250" y1="290" x2="250" y2="328" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="264" y="314" font-size="13" font-weight="bold" fill="#111111">Yes</text>
  <rect x="140" y="330" width="220" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="360" text-anchor="middle" font-size="14" fill="#111111">Take the next number</text>
  <line x1="250" y1="380" x2="250" y2="418" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="250,420 360,465 250,510 140,465" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="250" y="461" text-anchor="middle" font-size="13" fill="#111111">Is it larger</text>
  <text x="250" y="478" text-anchor="middle" font-size="13" fill="#111111">than largest?</text>

  <line x1="250" y1="510" x2="250" y2="548" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="264" y="534" font-size="13" font-weight="bold" fill="#111111">Yes</text>
  <rect x="140" y="550" width="220" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="580" text-anchor="middle" font-size="14" fill="#111111">largest = that number</text>

  <line x1="140" y1="465" x2="80" y2="465" stroke="#333333" stroke-width="2"/>
  <text x="110" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">No</text>
  <path d="M140,575 L80,575 L80,245 L138,245" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="62" y="410" text-anchor="end" font-size="12" fill="#111111">go back and</text>
  <text x="62" y="426" text-anchor="end" font-size="12" fill="#111111">ask again</text>

  <text x="350" y="635" text-anchor="middle" font-size="13" fill="#111111">Try it with [4, 11, 7]: largest starts at 4, becomes 11, then stays 11.</text>
  <text x="350" y="655" text-anchor="middle" font-size="13" fill="#111111">The loop repeats until there are no more numbers to check.</text>
</svg>
