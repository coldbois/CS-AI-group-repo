<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="m6b7280" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="s6b7280" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/></marker></defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450.0" y="36" font-size="22" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Transactions: all or nothing</text>
  <text x="450.0" y="60" font-size="14" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Moving 100 from Ana to Ben is two steps that must stay together</text>
  <text x="30" y="85" font-size="16" fill="#15803d" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">✓ Everything works</text>
  <rect x="30" y="100" width="150" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="105.0" y="134.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">BEGIN</text>
  <path d="M182,130 L208,130" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="210" y="100" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="285.0" y="134.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Ana: 500 → 400</text>
  <path d="M362,130 L388,130" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="390" y="100" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="465.0" y="134.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Ben: 100 → 200</text>
  <path d="M542,130 L568,130" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="570" y="100" width="150" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="645.0" y="134.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">COMMIT</text>
  <path d="M722,130 L748,130" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="750" y="100" width="150" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="825.0" y="134.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">saved for good</text>
  <rect x="30" y="175" width="840" height="40" rx="8" fill="#f3f4f6" stroke="#15803d" stroke-width="2"/>
  <text x="450.0" y="199.9" font-size="14" fill="#15803d" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Result: Ana 400, Ben 200 (total still 600)</text>
  <text x="30" y="275" font-size="16" fill="#b91c1c" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">⚡ Power cut in the middle</text>
  <rect x="30" y="290" width="150" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="105.0" y="324.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">BEGIN</text>
  <path d="M182,320 L208,320" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="210" y="290" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="285.0" y="324.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Ana: 500 → 400</text>
  <path d="M362,320 L388,320" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="390" y="290" width="150" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="465.0" y="324.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">⚡ CRASH</text>
  <path d="M542,320 L568,320" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="570" y="290" width="150" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="645.0" y="324.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">ROLLBACK</text>
  <path d="M722,320 L748,320" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#m6b7280)"/>
  <rect x="750" y="290" width="150" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="825.0" y="324.55" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Ana back to 500</text>
  <rect x="30" y="365" width="840" height="40" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="2"/>
  <text x="450.0" y="389.9" font-size="14" fill="#b91c1c" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Result: Ana 500, Ben 100 (nothing lost, nothing half-done)</text>
  <text x="450" y="455" font-size="14" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-style="italic">Without a transaction, the crash would leave Ana at 400 and Ben at 100: 100 would vanish.</text>
</svg>
