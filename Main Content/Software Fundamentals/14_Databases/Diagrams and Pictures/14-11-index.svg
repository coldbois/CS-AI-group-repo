  <text x="310" y="365" font-size="14" fill="#b91c1c" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Without an index: check rows 1, 2, 3… until you find Ana.</text>
  <text x="310" y="390" font-size="14" fill="#15803d" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">With an index: look up Ana in the sorted list → jump to row 3.</text>
  <text x="310" y="415" font-size="14" fill="#6b7280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-style="italic">Trade-off: the index must be updated on every insert.</text>
