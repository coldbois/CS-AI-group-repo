  <text x="640" y="400" font-size="14" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"><tspan x="640" dy="0">Only year-1 students (Ana, Cho)</tspan><tspan x="640" dy="17.5">Only the name and email columns</tspan><tspan x="640" dy="17.5">Sorted A → Z by name</tspan></text>
