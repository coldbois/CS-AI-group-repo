  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450.0" y="36" font-size="22" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Reading a SELECT query</text>
  <text x="450.0" y="60" font-size="14" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Each line answers one question</text>
  <rect x="40" y="85" width="330" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="52" y="115.3" font-size="18" fill="#1f2937" text-anchor="start" font-family="Consolas, Menlo, monospace" font-weight="bold">SELECT name, email</text>
  <path d="M374,109 L430,109" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#m1d4ed8)"/>
  <text x="440" y="115" font-size="16" fill="#1d4ed8" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Which COLUMNS do I want to see?</text>
  <rect x="40" y="147" width="330" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="52" y="177.3" font-size="18" fill="#1f2937" text-anchor="start" font-family="Consolas, Menlo, monospace" font-weight="bold">FROM Students</text>
  <path d="M374,171 L430,171" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#m7c3aed)"/>
  <text x="440" y="177" font-size="16" fill="#7c3aed" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Which TABLE do I look in?</text>
  <rect x="40" y="209" width="330" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="52" y="239.3" font-size="18" fill="#1f2937" text-anchor="start" font-family="Consolas, Menlo, monospace" font-weight="bold">WHERE year = 1</text>
  <path d="M374,233 L430,233" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mb45309)"/>
  <text x="440" y="239" font-size="16" fill="#b45309" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Which ROWS do I keep? (a condition)</text>
  <rect x="40" y="271" width="330" height="48" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="52" y="301.3" font-size="18" fill="#1f2937" text-anchor="start" font-family="Consolas, Menlo, monospace" font-weight="bold">ORDER BY name;</text>
  <path d="M374,295 L430,295" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#m15803d)"/>
  <text x="440" y="301" font-size="16" fill="#15803d" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">How should the result be SORTED?</text>
