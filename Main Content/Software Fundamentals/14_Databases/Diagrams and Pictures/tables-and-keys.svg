<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">Linking tables with keys</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <!-- Students -->
  <g font-size="14" fill="#1f2937">
    <rect x="20" y="70" width="230" height="32" fill="#1d4ed8"/>
    <text x="135" y="92" text-anchor="middle" fill="#fff" font-weight="bold">Students</text>
    <rect x="20" y="102" width="230" height="28" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="30" y="121" font-weight="bold">student_id 🔑</text><text x="150" y="121" font-weight="bold">name</text>
    <rect x="20" y="130" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="30" y="149">1</text><text x="150" y="149">Ana</text>
    <rect x="20" y="158" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="30" y="177">2</text><text x="150" y="177">Ben</text>
    <rect x="20" y="186" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="30" y="205">3</text><text x="150" y="205">Cho</text>
  </g>

  <!-- Enrolments -->
  <g font-size="14" fill="#1f2937">
    <rect x="335" y="70" width="230" height="32" fill="#7c3aed"/>
    <text x="450" y="92" text-anchor="middle" fill="#fff" font-weight="bold">Enrolments</text>
    <rect x="335" y="102" width="230" height="28" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="345" y="121" font-weight="bold">student_id</text><text x="440" y="121" font-weight="bold">course_id</text><text x="520" y="121" font-weight="bold">grade</text>
    <rect x="335" y="130" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="345" y="149">1</text><text x="440" y="149">CS101</text><text x="520" y="149">A</text>
    <rect x="335" y="158" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="345" y="177">1</text><text x="440" y="177">AI150</text><text x="520" y="177">B</text>
    <rect x="335" y="186" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="345" y="205">2</text><text x="440" y="205">CS101</text><text x="520" y="205">C</text>
    <rect x="335" y="214" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="345" y="233">3</text><text x="440" y="233">AI150</text><text x="520" y="233">A</text>
  </g>

  <!-- Courses -->
  <g font-size="14" fill="#1f2937">
    <rect x="650" y="70" width="230" height="32" fill="#b45309"/>
    <text x="765" y="92" text-anchor="middle" fill="#fff" font-weight="bold">Courses</text>
    <rect x="650" y="102" width="230" height="28" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="660" y="121" font-weight="bold">course_id 🔑</text><text x="770" y="121" font-weight="bold">title</text>
    <rect x="650" y="130" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="660" y="149">CS101</text><text x="770" y="149">Intro to Prog.</text>
    <rect x="650" y="158" width="230" height="28" fill="#fff" stroke="#e5e7eb"/>
    <text x="660" y="177">AI150</text><text x="770" y="177">Symbolic AI</text>
  </g>

  <!-- Arrows: foreign key -> primary key -->
  <path d="M340,145 C300,145 290,145 255,145" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M460,244 C460,280 680,280 720,192" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- Legend -->
  <g font-size="15" fill="#374151">
    <text x="20" y="300">🔑 <tspan font-weight="bold">Primary key</tspan>: unique ID for each row (student_id, course_id).</text>
    <text x="20" y="326"><tspan fill="#7c3aed" font-weight="bold">→ Foreign key</tspan>: a column in Enrolments that points to a primary key in another table.</text>
    <text x="20" y="352">Read row 1 of Enrolments: student 1 (Ana) took course CS101 (Intro to Programming) and got an A.</text>
  </g>
</svg>
