<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs></defs>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450.0" y="36" font-size="22" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Tree: data arranged in levels</text>
  <text x="450.0" y="60" font-size="14" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Example: folders on a computer</text>
  <line x1="510" y1="132" x2="330" y2="198" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="510" y1="132" x2="760" y2="198" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="330" y1="242" x2="230" y2="308" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="330" y1="242" x2="430" y2="308" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="760" y1="242" x2="760" y2="308" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="230" y1="352" x2="160" y2="418" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="230" y1="352" x2="310" y2="418" stroke="#6b7280" stroke-width="2.5"/>
  <rect x="465.0" y="88" width="90" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="510.0" y="115.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">C:\</text>
  <rect x="285.0" y="198" width="90" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330.0" y="225.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Users</text>
  <rect x="680.0" y="198" width="160" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="760.0" y="225.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Program Files</text>
  <rect x="185.0" y="308" width="90" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="230.0" y="335.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Talgat</text>
  <rect x="385.0" y="308" width="90" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="430.0" y="335.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Guest</text>
  <rect x="715.0" y="308" width="90" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="760.0" y="335.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Python</text>
  <rect x="100.0" y="418" width="120" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="160.0" y="445.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Documents</text>
  <rect x="255.0" y="418" width="110" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="310.0" y="445.25" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">Pictures</text>
  <text x="40" y="115" font-size="13" fill="#6b7280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">level 0</text>
  <text x="40" y="225" font-size="13" fill="#6b7280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">level 1</text>
  <text x="40" y="335" font-size="13" fill="#6b7280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">level 2</text>
  <text x="40" y="445" font-size="13" fill="#6b7280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">level 3</text>
  <text x="570" y="115" font-size="14" fill="#b45309" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold">← ROOT: the top, has no parent</text>
  <text x="485" y="328" font-size="13" fill="#1d4ed8" text-anchor="start" font-family="Segoe UI, Arial, sans-serif"><tspan x="485" dy="0">← CHILDREN of Users</tspan><tspan x="485" dy="16.25">    (Users is their PARENT)</tspan></text>
  <text x="450" y="450" font-size="14" fill="#15803d" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold"><tspan x="450" dy="0">LEAF = a node with no children</tspan><tspan x="450" dy="17.5">(green: Guest, Python, Documents, Pictures)</tspan></text>
  <text x="450" y="510" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-style="italic">Every node has exactly one parent (except the root), and there are no loops.</text>
</svg>
