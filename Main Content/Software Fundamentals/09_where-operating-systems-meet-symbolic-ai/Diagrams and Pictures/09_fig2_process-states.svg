<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Arial, Helvetica, sans-serif">
  <title>Figure 2: Life cycle of a process (process states)</title>
  <desc>Five states: New, Ready, Running, Waiting and Terminated, with labelled arrows for each allowed change of state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 2: Life cycle of a process (process states)</text>

  <rect x="40" y="170" width="120" height="60" rx="14" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="100" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">New</text>

  <rect x="250" y="170" width="120" height="60" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Ready</text>

  <rect x="500" y="170" width="120" height="60" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Running</text>

  <rect x="740" y="170" width="130" height="60" rx="14" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="805" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Terminated</text>

  <rect x="375" y="330" width="140" height="60" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="445" y="357" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Waiting</text>
  <text x="445" y="376" text-anchor="middle" font-size="12" fill="#111111">(blocked)</text>

  <line x1="160" y1="200" x2="248" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="190" text-anchor="middle" font-size="12" fill="#111111">admitted</text>

  <line x1="370" y1="185" x2="498" y2="185" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="177" text-anchor="middle" font-size="12" fill="#111111">scheduler picks it</text>

  <line x1="500" y1="215" x2="372" y2="215" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="234" text-anchor="middle" font-size="12" fill="#111111">time slice ends</text>

  <line x1="620" y1="200" x2="738" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="679" y="190" text-anchor="middle" font-size="12" fill="#111111">finishes (exit)</text>

  <line x1="545" y1="230" x2="492" y2="328" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="552" y="285" font-size="12" fill="#111111">waits for I/O</text>

  <line x1="400" y1="330" x2="340" y2="232" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="295" text-anchor="end" font-size="12" fill="#111111">I/O finished</text>

  <text x="450" y="425" text-anchor="middle" font-size="13" fill="#111111">Only a Ready process can be picked to run. On a one-core CPU, at most one process is Running at any moment.</text>
</svg>
