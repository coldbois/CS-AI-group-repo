<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Arial, Helvetica, sans-serif">
  <title>Figure 5: Forward chaining on the slow-computer example</title>
  <desc>Facts memory_full and disk_activity_high make rule R2 fire and add suspect_thrashing. Then rule R3 fires and adds the recommendation. The fact cpu_usage_high is known but does not make R1 fire.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Figure 5: Forward chaining on the slow-computer example</text>

  <rect x="30" y="60" width="190" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="125" y="88" text-anchor="middle" font-size="14" fill="#111111">memory_full</text>
  <rect x="30" y="130" width="190" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="125" y="158" text-anchor="middle" font-size="14" fill="#111111">disk_activity_high</text>
  <rect x="30" y="200" width="190" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="125" y="228" text-anchor="middle" font-size="14" fill="#111111">cpu_usage_high</text>
  <text x="240" y="219" font-size="12" fill="#111111">R1 does not fire: it also needs</text>
  <text x="240" y="235" font-size="12" fill="#111111">one_process_uses_most_cpu</text>

  <text x="345" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Cycle 1</text>
  <rect x="280" y="95" width="130" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="345" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Rule R2</text>
  <line x1="220" y1="84" x2="278" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="152" x2="278" y2="126" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="470" y="95" width="190" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="565" y="123" text-anchor="middle" font-size="14" fill="#111111">suspect_thrashing</text>
  <line x1="410" y1="117" x2="468" y2="117" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="439" y="108" text-anchor="middle" font-size="11" fill="#111111">adds</text>

  <text x="765" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Cycle 2</text>
  <rect x="700" y="95" width="130" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="765" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Rule R3</text>
  <line x1="660" y1="117" x2="698" y2="117" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="210" width="300" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="710" y="240" text-anchor="middle" font-size="13" fill="#111111">recommend_close_programs_or_add_ram</text>
  <line x1="765" y1="139" x2="765" y2="208" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="180" font-size="11" fill="#111111">adds</text>

  <text x="450" y="298" text-anchor="middle" font-size="13" fill="#111111">Forward chaining: start with the known facts, fire every rule whose conditions are all true, add the new facts,</text>
  <text x="450" y="316" text-anchor="middle" font-size="13" fill="#111111">and repeat until no rule can add anything new (Cycle 3: nothing new, so stop).</text>
</svg>
